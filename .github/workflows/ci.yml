name: CI

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate commit to qualify
        required: true
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'continuous' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-verify:
    name: docs-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"

      - name: Pin and verify Node.js and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const runtime = { node: process.version, arch: process.arch, platform: process.platform,
              abi: process.versions.modules, glibc: process.report.getReport().header.glibcVersionRuntime };
            assert.equal(runtime.node, "v22.23.2");
            assert.equal(runtime.platform, "linux");
            assert.equal(runtime.arch, "x64");
            assert.equal(runtime.abi, "127");
            assert.ok(runtime.glibc);
            console.log(JSON.stringify(runtime));
          '
          npm install --global --ignore-scripts npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Verify docs freshness and integrity
        run: npm run docs:verify

  backend-verify:
    name: backend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      - name: Pin and verify Node.js and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const runtime = { node: process.version, arch: process.arch, platform: process.platform,
              abi: process.versions.modules, glibc: process.report.getReport().header.glibcVersionRuntime };
            assert.equal(runtime.node, "v22.23.2");
            assert.equal(runtime.platform, "linux");
            assert.equal(runtime.arch, "x64");
            assert.equal(runtime.abi, "127");
            assert.ok(runtime.glibc);
            console.log(JSON.stringify(runtime));
          '
          npm install --global --ignore-scripts npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Bind source and dependency locks before install
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$EXPECTED_SHA" = "$GITHUB_SHA"
          fi
          locks=(package-lock.json cli/package-lock.json web/package-lock.json web-next/package-lock.json packages/feed-sdk/package-lock.json examples/civility-component/package-lock.json)
          for lock in "${locks[@]}"; do
            test -f "$lock" && test ! -L "$lock"
            git ls-files --error-unmatch -- "$lock" > /dev/null
          done
          git diff --exit-code HEAD -- "${locks[@]}"
          sha256sum "${locks[@]}" | tee "$RUNNER_TEMP/corgi-${GITHUB_JOB}-locks.sha256"
          printf 'source=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Install CLI dependencies
        run: cd cli && npm ci --ignore-scripts

      - name: Prepare backend test env
        run: cp .env.example .env

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test -- --run

      - name: Build CLI
        run: npm run cli:build

      - name: Build local MCP server
        run: npm run build:mcp-local

      - name: Security audit (backend)
        run: node scripts/audit-allowlist.mjs --workspace=root --audit-level=moderate

      - name: Security audit (CLI)
        working-directory: cli
        run: node ../scripts/audit-allowlist.mjs --workspace=cli --audit-level=moderate

      # This proves the changed Alpine image's native modules, not production
      # readiness. The separate following harness result covers ordinary CMD
      # and dependency readiness with disposable PostgreSQL/two Redis stores.
      - name: Build and probe native Linux x64 Alpine image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          case "$(docker info --format '{{.Architecture}}')" in
            x86_64|amd64) ;;
            *) echo 'Native x64 Docker daemon required' >&2; exit 1 ;;
          esac
          image="corgi-runtime-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          probe="corgi-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          existing_containers=$(docker container ls -aq --filter "name=^/${probe}$")
          existing_images=$(docker image ls -q "$image")
          test -z "$existing_containers"
          test -z "$existing_images"
          ownership="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            primary_status=$?
            cleanup_status=0
            trap - EXIT
            if remaining=$(docker container ls -aq --filter "name=^/${probe}$"); then
              if [ -n "$remaining" ]; then
                if owner=$(docker inspect --format '{{index .Config.Labels "corgi.runtime-ci"}}' "$remaining") && [ "$owner" = "$ownership" ]; then
                  docker container rm -f "$remaining" || cleanup_status=1
                else
                  echo 'Refusing cleanup of unverified probe ownership' >&2
                  cleanup_status=1
                fi
              fi
            else
              echo 'Probe inventory observation failed' >&2
              cleanup_status=1
            fi
            if remaining=$(docker image ls -q "$image"); then
              if [ -n "$remaining" ]; then
                if owner=$(docker image inspect --format '{{index .Config.Labels "corgi.runtime-ci"}}' "$image") && [ "$owner" = "$ownership" ]; then
                  docker image rm "$image" || cleanup_status=1
                else
                  echo 'Refusing cleanup of unverified image ownership' >&2
                  cleanup_status=1
                fi
              fi
            else
              echo 'Image inventory observation failed' >&2
              cleanup_status=1
            fi
            printf 'primary_exit=%s cleanup_exit=%s\n' "$primary_status" "$cleanup_status"
            if [ "$primary_status" -ne 0 ]; then exit "$primary_status"; fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT
          git archive --format=tar HEAD | docker build --platform linux/amd64 \
            --iidfile "$RUNNER_TEMP/corgi-runtime-image.id" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "corgi.runtime-ci=$ownership" --tag "$image" -
          image_id=$(cat "$RUNNER_TEMP/corgi-runtime-image.id")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image_id=%s\n' "$image_id"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" = linux/amd64
          test "$(docker image inspect --format '{{.Config.User}}' "$image_id")" = appuser
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")" = "$GITHUB_SHA"
          docker image inspect --format '{{json .Config.Cmd}} {{json .Config.Healthcheck}}' "$image_id"
          docker run --rm --interactive --name "$probe" --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL \
            --security-opt no-new-privileges --label "corgi.runtime-ci=$ownership" --entrypoint sh "$image_id" -es <<'IMAGE_PROBE'
              test "$(npm --version)" = 11.19.1
              cat /etc/alpine-release
              ldd --version 2>&1 | grep -F musl
              sh /app/scripts/check-legal-docs.sh /app/legal
              node --input-type=module <<'NATIVE_JS'
                import assert from "node:assert/strict";
                import sharp from "sharp";
                import * as ort from "onnxruntime-node";
                assert.equal(process.version, "v22.23.2");
                assert.equal(process.versions.modules, "127");
                assert.equal(process.arch, "x64");
                assert.equal(process.platform, "linux");
                assert.equal(process.getuid(), 1001);
                assert.equal(process.report.getReport().header.glibcVersionRuntime, undefined);
                assert.equal(typeof ort.InferenceSession.create, "function");
                const output = await sharp({ create: { width: 1, height: 1, channels: 3,
                  background: { r: 0, g: 0, b: 0 } } }).png().toBuffer();
                assert.equal((await sharp(output).metadata()).format, "png");
                console.log(JSON.stringify({ verdict: "PASS_NATIVE_IMAGE_MODULES_ONLY", node: process.version,
                  arch: process.arch, abi: process.versions.modules, uid: process.getuid(), pngBytes: output.length }));
          NATIVE_JS
          IMAGE_PROBE
          python3 tests/harness/route-b-runtime-image-smoke.py \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/corgi-image-startup" \
            --image-id "$image_id" --expected-sha "$GITHUB_SHA"

      - name: Verify source and dependency locks after validation
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check "$RUNNER_TEMP/corgi-${GITHUB_JOB}-locks.sha256"

      - name: Retain native qualification receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # existing deploy artifact pin
        with:
          name: route-b-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/corgi-backend-verify-locks.sha256
            ${{ runner.temp }}/corgi-runtime-image.id
            ${{ runner.temp }}/corgi-image-startup/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  frontend-verify:
    name: frontend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            web-next/package-lock.json

      - name: Pin and verify Node.js and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const runtime = { node: process.version, arch: process.arch, platform: process.platform,
              abi: process.versions.modules, glibc: process.report.getReport().header.glibcVersionRuntime };
            assert.equal(runtime.node, "v22.23.2");
            assert.equal(runtime.platform, "linux");
            assert.equal(runtime.arch, "x64");
            assert.equal(runtime.abi, "127");
            assert.ok(runtime.glibc);
            console.log(JSON.stringify(runtime));
          '
          npm install --global --ignore-scripts npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Bind source and dependency locks before install
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$EXPECTED_SHA" = "$GITHUB_SHA"
          fi
          locks=(package-lock.json cli/package-lock.json web/package-lock.json web-next/package-lock.json packages/feed-sdk/package-lock.json examples/civility-component/package-lock.json)
          for lock in "${locks[@]}"; do
            test -f "$lock" && test ! -L "$lock"
            git ls-files --error-unmatch -- "$lock" > /dev/null
          done
          git diff --exit-code HEAD -- "${locks[@]}"
          sha256sum "${locks[@]}" | tee "$RUNNER_TEMP/corgi-${GITHUB_JOB}-locks.sha256"
          printf 'source=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Install frontend dependencies
        run: cd web && npm ci --ignore-scripts

      - name: Install Next.js frontend dependencies
        run: cd web-next && npm ci --ignore-scripts

      # Supply-chain guard for axios: require an EXACT pin (no ^/~/range) that
      # matches the resolved package-lock version. Self-maintaining — Dependabot
      # bumps package.json + the lockfile together, so reviewed bumps pass with no
      # manual edit here. Replaces the hard-coded version literal that drifted red
      # on every bump (PROJ-1289 1.16->1.17, PROJ-1499 ->1.18.x).
      - name: Validate frontend Axios pin
        run: |
          node --input-type=module -e '
            import fs from "node:fs";

            for (const workspace of ["web", "web-next"]) {
              const packagePath = `${workspace}/package.json`;
              const lockPath = `${workspace}/package-lock.json`;
              const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
              const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
              const declared = pkg.dependencies?.axios;
              const resolved = lock.packages?.["node_modules/axios"]?.version;
              const axiosEntries = Object.entries(lock.packages ?? {}).filter(
                ([location]) => location === "node_modules/axios" || location.endsWith("/node_modules/axios"),
              );
              if (!declared || !/^\d+\.\d+\.\d+$/.test(declared)) {
                throw new Error(`${packagePath} must pin axios to an exact version (no ^/~/range); found ${declared ?? "missing"}`);
              }
              if (declared !== resolved) {
                throw new Error(`${packagePath} axios (${declared}) must match ${lockPath} resolved axios (${resolved ?? "missing"})`);
              }
              for (const [location, entry] of axiosEntries) {
                if (entry.version !== declared) {
                  throw new Error(`${lockPath} has ${location} at ${entry.version ?? "missing"}; expected ${declared}`);
                }
              }
            }
          '

      - name: Lint frontend
        run: cd web && npm run lint

      - name: Build frontend
        run: cd web && npm run build

      - name: Build Next.js frontend
        run: cd web-next && npm run build

      - name: Security audit (frontend)
        working-directory: web
        run: node ../scripts/audit-allowlist.mjs --workspace=web --audit-level=moderate

      - name: Security audit (Next.js frontend)
        working-directory: web-next
        run: node ../scripts/audit-allowlist.mjs --workspace=web-next --audit-level=moderate

      - name: Verify source and dependency locks after validation
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check "$RUNNER_TEMP/corgi-${GITHUB_JOB}-locks.sha256"

  report-scripts-verify:
    name: report-scripts-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-report.txt

      - name: Compile report scripts
        run: |
          python3 -m py_compile \
            scripts/generate-report.py \
            scripts/generate-report-pdf.py \
            scripts/report_utils.py

      - name: Verify DOCX report script (offline dry-run)
        run: |
          MPLCONFIGDIR=/tmp python3 scripts/generate-report.py \
            --csv tests/fixtures/report/report-sample.csv \
            --epoch-json tests/fixtures/report/epoch-sample.json \
            --dry-run

      - name: Verify PDF report script (offline dry-run)
        run: |
          MPLCONFIGDIR=/tmp python3 scripts/generate-report-pdf.py \
            --csv tests/fixtures/report/report-sample.csv \
            --epoch-json tests/fixtures/report/epoch-sample.json \
            --dry-run
