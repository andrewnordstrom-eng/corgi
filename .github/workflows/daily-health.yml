name: Daily Health Check

on:
  schedule:
    - cron: '0 8 * * *' # Daily 8 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-operations

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Merge only after the protected environment, fixed commands and dedicated
      # credentials have passed the separately approved Phase B host acceptance.
      - name: Check operations on VPS
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_OPERATIONS_DATABASE_URL }}
          VPS_HOST: ${{ secrets.PRODUCTION_OPERATIONS_HOST }}
          VPS_SSH_KEY: ${{ secrets.PRODUCTION_OPERATIONS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.PRODUCTION_OPERATIONS_SSH_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL VPS_HOST VPS_SSH_KEY VPS_SSH_HOST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production-operations input: $name"
              exit 1
            fi
          done
          # This packet uses the verified IPv4 endpoint, never SSH option syntax.
          if [[ ! "$VPS_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Operations host must be the approved IPv4 address"
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/corgi-operations.XXXXXX")
          trap 'rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          unset VPS_SSH_KEY VPS_SSH_HOST_KEY
          ssh_options=(
            -F /dev/null -T
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=10 -o ConnectionAttempts=1
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2
            -o ForwardAgent=no -o ClearAllForwardings=yes
            -i "$ssh_dir/id_ed25519"
          )
          # Only these four literal tokens cross SSH. The database URL is stdin,
          # and the remote dispatcher independently validates and bounds it.
          printf '%s\n' "$DATABASE_URL" | timeout --signal=KILL 30s \
            ssh "${ssh_options[@]}" "corgi-operations@$VPS_HOST" epoch-status
          unset DATABASE_URL
          DISK=$(timeout --signal=KILL 30s ssh "${ssh_options[@]}" "corgi-operations@$VPS_HOST" disk-root < /dev/null)
          DISK_PCT=$(printf '%s\n' "$DISK" | awk 'NR == 2 {print $5}')
          if [[ ! "$DISK_PCT" =~ ^[0-9]{1,3}%$ ]]; then
            echo "::error::Invalid POSIX disk usage response"
            exit 1
          fi
          DISK_PCT=$((10#${DISK_PCT%\%}))
          echo "Disk usage: ${DISK_PCT}%"
          if [ "$DISK_PCT" -ge 90 ]; then
            echo "::error::VPS disk is at or above the critical 90% threshold"
            exit 1
          elif [ "$DISK_PCT" -ge 80 ]; then
            echo "::warning::VPS disk is at or above the warning 80% threshold"
          fi
          timeout --signal=KILL 30s ssh "${ssh_options[@]}" "corgi-operations@$VPS_HOST" health-ready < /dev/null > /dev/null
          # An SSH/sudo/Docker/Redis failure is an error. Only a successful empty
          # GET is missing data, which retains the existing warning behavior.
          UPDATED=$(timeout --signal=KILL 30s ssh "${ssh_options[@]}" "corgi-operations@$VPS_HOST" feed-updated-at < /dev/null)
          if [ -z "$UPDATED" ]; then
            echo "::warning::Feed updated_at not found in Redis"
          else
            if ! UPDATED_EPOCH=$(date -d "$UPDATED" +%s 2>/dev/null); then
              echo "::error::Feed updated_at is not a valid timestamp"
              exit 1
            fi
            NOW_EPOCH=$(date +%s)
            if [ "$UPDATED_EPOCH" -gt "$NOW_EPOCH" ] || [ "$UPDATED_EPOCH" -le 0 ]; then
              echo "::error::Feed updated_at is outside the valid time range"
              exit 1
            fi
            AGE_SECONDS=$((NOW_EPOCH - UPDATED_EPOCH))
            if [ "$AGE_SECONDS" -gt 1800 ]; then
              echo "::error::Feed is more than 30 minutes stale"
              exit 1
            fi
          fi

      - name: Check public endpoint
        run: |
          if curl -sf --max-time 10 https://feed.corgi.network/health/live > /dev/null 2>&1; then
            echo "Public health endpoint OK"
          else
            echo "Public health endpoint unreachable"
            exit 1
          fi

      - name: Ping health monitor on success
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -n "${HC_URL:-}" ]; then
            curl -fsS "${HC_URL}" || true
          fi

      - name: Alert health monitor on failure
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -n "${HC_URL:-}" ]; then
            curl -fsS "${HC_URL}/fail" || true
          fi

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = 'Feed Health Alert - ' + today;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident',
              per_page: 10,
            });

            const alreadyOpen = existing.data.some(i => i.title === title);
            if (alreadyOpen) {
              console.log('Issue already exists for today, skipping');
              return;
            }

            const runUrl = [
              context.serverUrl,
              context.repo.owner,
              context.repo.repo,
              'actions/runs',
              context.runId,
            ].join('/');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'The daily health check workflow failed.',
                '',
                '**Run:** ' + runUrl,
                '**Time:** ' + new Date().toISOString(),
                '',
                'Check the workflow logs for details.',
              ].join('\n'),
              labels: ['incident'],
            });
